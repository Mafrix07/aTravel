
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise !!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        .valentine-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            margin-top: 5rem; /* Space for nav */
        }
        .valentine-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #d147a3;
            font-family: var(--handwriting-font);
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .valentine-card p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 2rem;
            position: relative;
            min-height: 80px;
        }
        .button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            display: inline-block;
        }
        .button.yes {
            background-color: #ff4d6d;
        }
        .button.no {
            background-color: #777;
            position: relative;
        }
        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        .image-placeholder {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            box-shadow: var(--box-shadow);
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <main class="valentine-main">
        <div class="valentine-card">
            <h1>Chère MPM,</h1>
            <p>En ce jour spécial, j'ai une question très importante à te poser. Chaque moment passé avec toi est un cadeau, et tu illumines ma vie de mille feux.</p>
            <p>J'ai cherché les mots justes, mais parfois, la simplicité est la plus belle des preuves. Alors...</p>
            <img src="AppelVideo.jpeg" alt="Un moment spécial" class="image-placeholder">
            <p style="font-size: 1.5rem; font-weight: bold; color: #ff4d6d;">Voudrais-tu être ma Valentine ?</p>

            <div class="buttons">
                <button id="yesBtn" class="button yes">OUI !</button>
                <button id="noBtn" class="button no">NON...</button>
            </div>
            
            <p id="responseMessage" style="margin-top: 2rem; font-style: italic; color: #777; display: none;"></p>
        </div>
    </main>

    <canvas id="confetti-canvas"></canvas>

    <script src="nav.js"></script>
    <script src="main.js"></script>
    <script src="animation.js"></script>
    <script src="valentine.js"></script>
</body>
</html>
